<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img">
<title>Where data is stored (structure as of 2026-09-28)</title>
<desc>Private data lives under matters, never in git: one folder per tenant named by a random id, one folder per matter inside it. A matter folder holds matter.json with current state, events.jsonl with the append-only history, sessions with one transcript per visit, and the lease files and letters. Shared, read-only corpora live in git: statutes, playbooks, and calendars.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .c-purple > rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .c-purple > .th { fill: #3C3489; } .c-purple > .ts { fill: #534AB7; }
  .c-teal > rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .c-teal > .th { fill: #085041; } .c-teal > .ts { fill: #0F6E56; }
  .c-gray > rect, rect.c-gray { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray > .th { fill: #444441; } .c-gray > .ts { fill: #5F5E5A; }
</style>
