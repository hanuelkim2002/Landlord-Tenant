issue: rent_increased
description: The landlord has raised the rent or says the rent will go up.
sections: ["83.46", "83.57", "83.64", "83.425", "83.42"]   # the statute sections this playbook rests on; loaded into the prompt

provenance:
  statute_year: 2026
  verified_against: statutes/83.46.txt, statutes/83.57.txt, statutes/83.64.txt, statutes/83.425.txt, statutes/83.42.txt
  verified_by: null          # your name, once you've read each quote against the file
  verified_on: null
  version: 0.3

counting:
  convention: calendar days, trigger day not counted, no weekend or holiday adjustment
  status: ASSUMPTION. Florida's court rule for counting days has not been checked against statutory deadlines outside litigation. Show this line with every computed date.
  note: This playbook has no clocks. The stored text of Chapter 83, part II has no section on notice of a rent increase.

# ---------- read by code ----------
spec:
  elements:
    - id: monthly_rent
      type: money
      source: [lease_profile.rent, user]
    - id: new_rent
      type: money
      source: [user]
    - id: increase_notice_received
      type: date
      source: [user]
    - id: increase_notice_written
      type: bool
      source: [user]
    - id: increase_effective_date
      type: date
      source: [user]
    - id: fixed_term_lease
      type: bool
      source: [user]
    - id: term_end_date
      type: date
      source: [user]
      applies_if: fixed_term_lease
      compare_to: lease_profile.term_end      # shown next to the tenant's date when they differ
    - id: month_to_month
      type: bool
      source: [user]
    - id: complained_before_increase
      type: bool
      source: [user]
    - id: complaint_date
      type: date
      source: [user]
      applies_if: complained_before_increase
    - id: other_tenants_increase
      type: text
      source: [user]

  clocks: []

  lease_overrides: []

  exclusions:
    - cite: "83.64(3)"
      quote: "In any event, this section does not apply if the landlord proves that the eviction is for good cause."
    - cite: "83.42(1)"
      quote: "Residency or detention in a facility, whether public or private, when residence or detention is incidental to the provision of medical, geriatric, educational, counseling, religious, or similar services."
      note: College housing. The tool records the facts and does not decide whether this exclusion applies.

  related_issues: []

  open_questions:
    - id: no_increase_section
      sections: ["83.46", "83.57", "83.425"]
      text: >-
        The stored text of Chapter 83, part II has no section setting notice for a rent increase. 83.425 says "The
        regulation of residential tenancies, the landlord-tenant relationship, and all other matters covered under
        this part are preempted to the state." Set the lease's rent clause beside the increase, and for a tenancy
        without a fixed term, 83.57. Whether and how an increase may be made is not settled by the stored text; say
        so plainly with the readings.
      readings:
        - >-
          During a fixed term the rent is what the lease says, so an increase needs a lease clause allowing it or the
          tenant's agreement; part II adds nothing either way.
        - >-
          For a month-to-month tenancy, a landlord who may end it on 83.57 notice may change the rent on the same
          notice, "not less than 30 days’ notice prior to the end of any monthly period".
        - >-
          For a month-to-month tenancy no particular notice is needed, since no section sets one.
    - id: retaliation
      sections: ["83.64"]
      text: >-
        83.64(1) says "It is unlawful for a landlord to discriminatorily increase a tenant’s rent or decrease services
        to a tenant, or to bring or threaten to bring an action for possession or other civil action, primarily
        because the landlord is retaliating against the tenant." 83.64(4) defines "Discrimination" for that section.
        Set the record beside its parts: the complaint and its date, what the tenant knows about other tenants' rent,
        and the tenant's good faith. The landlord's motive is not in the record. What stays
        open is what the tenant can do about an increase alone.
      readings:
        - >-
          83.64 works only as a defense: 83.64(2) says retaliation "may be raised by the tenant as a defense in any
          action brought against him or her for possession", so a tenant facing only an increase has nothing to raise
          until such an action.
        - >-
          83.64(1) makes a discriminatory, retaliatory increase unlawful on its own terms, and 83.55 lets the tenant
          recover damages when the landlord fails to comply with part II.

# ---------- read by the model ----------
guidance:
  questions:
    monthly_rent: How much is your monthly rent?
    new_rent: What is the new rent the landlord is asking for?
    increase_notice_received: What date did you receive notice of the increase?
    increase_notice_written: Was the notice of the increase in writing?
    increase_effective_date: From what date does the landlord say the new rent applies?
    fixed_term_lease: Does your lease have a fixed end date (for example, a one-year lease)?
    term_end_date: What date does your lease term end?
    month_to_month: Is your tenancy month-to-month (no fixed end date, rent paid monthly)?
    complained_before_increase: Before the increase, had you complained about the condition of the unit (to the landlord in writing or to a government agency), or taken part in a tenant organization?
    complaint_date: What date did you make that complaint or take that step?
    other_tenants_increase: What do you know about whether other tenants got the same increase? Type "don't know" if you don't know.

  lease_checks:
    rent: The rent amount in the lease, next to the new rent.
    term_start: When the lease term began.
    term_end: When the lease term ends, next to the date the new rent applies from.

  evidence:
    - the notice of the increase, with its date and how it arrived
    - the lease, especially the rent and renewal clauses
    - any complaint made before the increase, with its date
    - anything showing what other tenants were charged

  postures:
    core: [today's date, the current rent, the new rent and the date it applies from, the tenant's request, delivery method]
    preserve: Asks the landlord to confirm the new rent, the date it applies from, and which lease provision it rests on. Cites nothing.
    assert: Adds the lease's rent clause, quoted.
    escalate: Adds the 83.64(1) sentence, quoted.
    notice_sufficiency: >-
      This tool computes no deadline for this issue: the statute text it holds (Chapter 83, part II) has no
      section on notice of a rent increase. A letter from you does not start any period this tool tracks.

  failure_modes:
    - Stating a notice period for rent increases; the stored text has none.
    - Saying an increase is retaliatory because it followed a complaint. 83.64(1) needs an increase that is discriminatory and "primarily because the landlord is retaliating against the tenant", and 83.64(4) makes different treatment "a prerequisite to a finding of retaliatory conduct".
    - Applying 83.64 without its condition that "the tenant must have acted in good faith".
    - Applying a local rent rule from memory; 83.425 preempts local regulation and the stored text holds none.
    - Comparing the increase date with the lease term yourself, or without the lease's own words; the tool compares no dates.
    - Computing any date outside compute_deadlines.
