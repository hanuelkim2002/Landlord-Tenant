issue: landlord_entered_unannounced
description: The landlord, or someone sent by the landlord, entered the tenant's unit without notice or at an unreasonable time.
sections: ["83.53", "83.67", "83.64", "83.55", "83.42"]   # the statute sections this playbook rests on; loaded into the prompt

provenance:
  statute_year: 2026
  verified_against: statutes/83.53.txt, statutes/83.67.txt, statutes/83.42.txt
  verified_by: null          # your name, once you've read each quote against the file
  verified_on: null
  version: 0.6

counting:
  convention: calendar days, trigger day not counted, no weekend or holiday adjustment
  status: ASSUMPTION. Florida's court rule for counting days has not been checked against statutory deadlines outside litigation. Show this line with every computed date.
  note: This playbook has no clocks. The notice rule in 83.53(2) is stated in hours, which compute_deadlines does not support.

# ---------- read by code ----------
spec:
  elements:
    - id: entry_date
      type: date
      source: [user]
    - id: entry_time
      type: text
      source: [user]
    - id: entry_reason_given
      type: text
      source: [user]
    - id: entry_notice_given
      type: bool
      source: [user]
    - id: entry_notice_details
      type: text
      source: [user]
      applies_if: entry_notice_given
    - id: tenant_consented
      type: bool
      source: [user]
    - id: emergency_claimed
      type: bool
      source: [user]
    - id: tenant_absent
      type: bool
      source: [user]
    - id: absence_notified
      type: bool
      source: [user]
      applies_if: tenant_absent
    - id: rent_current
      type: bool
      source: [user]
    - id: repeated_entries
      type: bool
      source: [user]
    - id: access_or_utilities_cut
      type: bool
      source: [user]

  clocks: []

  lease_overrides: []

  exclusions:
    - cite: "83.42(1)"
      quote: "Residency or detention in a facility, whether public or private, when residence or detention is incidental to the provision of medical, geriatric, educational, counseling, religious, or similar services."
      note: College housing. The tool records the facts and does not decide whether this exclusion applies.

  related_issues: []

  open_questions:
    - id: notice_in_hours
      sections: ["83.53"]
      text: >-
        83.53(2) says "“Reasonable notice” for the purpose of repair is notice given at least 24 hours prior to the
        entry". This tool counts in days and does not compute a time in hours. When the record says no notice was
        given, the 24-hour condition is not met on those facts; when notice was given, set the time the tenant gives
        beside the time of entry and say the tool does not count the hours between them.
    - id: purpose_of_entry
      sections: ["83.53"]
      text: >-
        83.53(2) sets three ways in: "at any time for the protection or preservation of the premises"; "upon
        reasonable notice to the tenant and at a reasonable time for the purpose of repair of the premises"; and,
        for the further purposes in 83.53(1) (inspecting, supplying agreed services, showing the unit, and the
        others listed), only in the circumstances 83.53(2)(a)-(d) list. When the reason in the record fits only
        one way in, apply that one; with no reason recorded, say which facts each turns on. A visit that could be
        repair of the premises or an agreed service (routine maintenance, servicing equipment in the unit, pest
        control) fits more than one, and which one it is stays open: give both readings and what each would mean
        for the entry, and call it neither.
      readings:
        - >-
          Routine maintenance is repair of the premises, so reasonable notice and a reasonable time are enough.
        - >-
          Routine maintenance or a service visit is one of the further purposes in 83.53(1), "supply agreed services"
          among them, so it needs the tenant's consent, an emergency, or another circumstance in 83.53(2)(a)-(d), and
          notice alone is not enough.
    - id: abuse_of_access
      sections: ["83.53"]
      text: >-
        83.53(3) says "The landlord shall not abuse the right of access nor use it to harass the tenant." The stored
        text does not define abuse or harassment. Set the record's entries beside it (how often, at what times, with what notice, whether it keeps happening).
      readings:
        - >-
          Abuse means entering outside the ways 83.53(2) allows, so entries the statute allows are not abuse however
          often they happen.
        - >-
          Entries each allowed on its own can still abuse the right, or harass, by their number, timing, or purpose,
          since 83.53(3) is a sentence of its own after the ways in.

  # What the tenant can do, and what decides whether it is open (TODO items 81 and 84): checked by code
  # (deterministic.check_options) from the confirmed facts, the clocks, and the lease profile, and given to the model
  # before any step toward it. A gate is met through any of its ways. The gates are the author's to check.
  options:
    - id: prohibited_practice_damages
      label: Seek damages of at least 3 months' rent for a utility cut off, a lockout, or doors, windows, or belongings removed
      cite: "83.67(6)"
      gates:
        - says: the landlord cut off a utility, blocked the tenant's access (such as by changing the locks), or removed doors, windows, or the tenant's belongings
          cite: "83.67(6)"
          quote: "A landlord who violates any provision of this section shall be liable to the tenant for actual and consequential damages or 3 months’ rent, whichever is greater, and costs, including attorney’s fees."
          ways:
            - fact: access_or_utilities_cut
              equals: true
              when_otherwise: The tenant confirmed the landlord has done none of these.
        - says: anything removed was not removed for maintenance, repair, or replacement, nor after a surrender, abandonment, or lawful eviction
          cite: "83.67(5)"
          quote: "shall not remove the outside doors, locks, roof, walls, or windows of the unit except for purposes of maintenance, repair, or replacement"
          ways:
            - check: what the landlord cut off, locked, or removed, and why; a removal for maintenance, repair, or replacement, and of the tenant's belongings after a surrender, abandonment, or lawful eviction, are the ones the statute allows
      steps: []

    - id: entry_damages
      label: Recover the damages caused by an entry the statute does not allow
      cite: "83.55"
      gates:
        - says: the tenant did not agree to the entry
          cite: "83.53(2)"
          quote: "With the consent of the tenant"
          ways:
            - fact: tenant_consented
              equals: false
              when_otherwise: The tenant confirmed agreeing to the entry.
        - says: it was not an emergency
          cite: "83.53(2)"
          quote: "In case of emergency"
          ways:
            - fact: emergency_claimed
              equals: false
              otherwise: unsettled
              open_question: purpose_of_entry
              when_otherwise: The landlord said it was an emergency; whether it was is not settled on the record.
        - says: the entry was not for the protection or preservation of the premises
          cite: "83.53(2)"
          quote: "The landlord may enter the dwelling unit at any time for the protection or preservation of the premises."
          ways:
            - open_question: purpose_of_entry
        - says: the tenant had not unreasonably refused to let the landlord in
          cite: "83.53(2)"
          quote: "When the tenant unreasonably withholds consent"
          ways:
            - check: whether the landlord asked to come in before and the tenant refused, and why
        - says: for a repair, the landlord did not give at least 24 hours' notice and come between 7:30 a.m. and 8:00 p.m.
          cite: "83.53(2)"
          quote: "“Reasonable notice” for the purpose of repair is notice given at least 24 hours prior to the entry, and reasonable time for the purpose of repair shall be between the hours of 7:30 a.m. and 8:00 p.m."
          ways:
            - says: the landlord gave no notice
              fact: entry_notice_given
              equals: false
              when_otherwise: The tenant confirmed the landlord gave notice.
            - says: the notice came less than 24 hours before, or the entry was outside 7:30 a.m. to 8:00 p.m.
              applies_if: entry_notice_given
              check: when the landlord's notice came and when the entry happened; the tool does not count hours
        - says: the tenant was not away for half a rent period, or, with the rent current, had told the landlord of the absence
          cite: "83.53(2)"
          quote: "If the tenant is absent from the premises for a period of time equal to one-half the time for periodic rental payments"
          ways:
            - says: the tenant was not away
              fact: tenant_absent
              equals: false
              when_otherwise: The tenant confirmed being away.
            - says: the absence was shorter than half a rent period, or the rent was current and the tenant had told the landlord of it
              applies_if: tenant_absent
              check: how long the tenant was away, beside half the rent period, and whether the rent was current and the landlord had been told of the absence
        - says: the entry caused the tenant damages
          cite: "83.55"
          quote: "the aggrieved party may recover the damages caused by the noncompliance"
          ways:
            - check: what the entry cost the tenant, with receipts or other proof
      steps: []
      also_open: [notice_in_hours, abuse_of_access]

# ---------- read by the model ----------
guidance:
  questions:
    entry_date: What date did the landlord (or someone sent by the landlord) enter your unit?
    entry_time: At what time of day did the entry happen?
    entry_reason_given: What reason, if any, did the landlord give for entering?
    entry_notice_given: Did the landlord tell you ahead of time that they would enter?
    entry_notice_details: When and how did the landlord tell you (the day and time of the message, and whether it was in writing)?
    tenant_consented: Did you agree to the entry?
    emergency_claimed: Did the landlord say it was an emergency?
    tenant_absent: Were you away from the unit when it happened?
    absence_notified: Had you told the landlord you would be away?
    rent_current: Is your rent paid up to date?
    repeated_entries: Has the landlord entered without notice more than once?
    access_or_utilities_cut: Has the landlord changed the locks, cut off a utility, or removed doors, windows, or your belongings?

  lease_checks:
    notices_to_landlord: Where the tenant's letter must be sent under the lease.

  evidence:
    - every message from the landlord about entering, with its date and time
    - door camera footage or photos, with timestamps
    - names of anyone who saw the entry
    - a list of every entry, with the date, the time, and any reason given
    - photos of changed locks, missing doors or windows, or utility shutoff notices

  postures:
    core: [today's date, the date and time of the entry, what the tenant asks for, delivery method]
    preserve: States the date and time of the entry and asks for advance notice of future entries. Cites nothing.
    assert: Adds the 83.53(2) sentence on reasonable notice, quoted.
    escalate: Adds the 83.53(3) sentence, quoted, and, if access or a utility was cut, the 83.67(6) sentence, quoted.
    notice_sufficiency: >-
      No deadline in Fla. Stat. 83.53 runs from a letter from you, and this tool computes none for this issue.
      The statute's notice rule is stated in hours ("notice given at least 24 hours prior to the entry"), which
      this tool records as you report it and does not compute.

  failure_modes:
    - Applying the 24-hour notice rule to an entry that was not for repair, or requiring notice for an entry "for the protection or preservation of the premises".
    - Saying an entry broke 83.53 while the record lacks the reason given, whether notice was given, or whether the tenant consented; name the missing fact.
    - Counting the hours between notice and entry yourself; the tool records the times and counts nothing.
    - Reading 83.53(1) as forbidding the tenant to change the locks. It is a duty not to "unreasonably withhold consent to the landlord to enter the dwelling unit" for the purposes it lists; whether a lock change does that turns on facts the record must show (an entry asked for, its purpose, the tenant's answer). The stored sentence on changing locks, 83.67(2), binds the landlord, who "shall not prevent the tenant from gaining reasonable access to the dwelling unit by any means".
    - Skipping 83.67 when the tenant mentions locks, utilities, or belongings. 83.67(6) makes a landlord who violates it "liable to the tenant for actual and consequential damages or 3 months’ rent, whichever is greater".
    - Promising an amount of damages. 83.55 (fetch it first) lets the aggrieved party "recover the damages caused by the noncompliance"; how much is for a court.
