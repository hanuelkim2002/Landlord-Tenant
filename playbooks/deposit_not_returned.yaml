issue: deposit_not_returned
description: The landlord has not returned the tenant's security deposit and has not sent a written claim against it.
sections: ["83.49", "83.505"]          # the statute sections this playbook rests on; loaded into the prompt

provenance:
  statute_year: 2026
  verified_against: statutes/83.49.txt, statutes/83.505.txt
  verified_by: null          # your name, once you've read each quote against the file
  verified_on: null
  version: 0.6

counting:
  convention: calendar days, trigger day not counted, no weekend or holiday adjustment
  status: ASSUMPTION. Florida's court rule for counting days has not been checked against statutory deadlines outside litigation. Show this line with every computed date.

# ---------- read by code ----------
spec:
  elements:
    - id: deposit_amount
      type: money
      source: [lease_profile.security_deposit, user]
    - id: tenancy_terminated
      type: date
      source: [user]
      compare_to: lease_profile.term_end      # shown next to the tenant's date when they differ
    - id: vacated
      type: date
      source: [user]
    - id: claim_notice_received
      type: bool
      source: [user]
    - id: claim_notice_date
      type: date
      source: [user]
      applies_if: claim_notice_received
    - id: claim_delivery                     # same id as in deposit_claim_received: asked once, shared
      type: choice
      source: [user]
      applies_if: claim_notice_received
      choices:
        - certified mail
        - regular mail
        - e-mail
        - handed to you
        - a text or a resident portal message
        - something else
        - I don't know
    - id: forwarding_address_given
      type: bool
      source: [user]
    - id: early_or_periodic
      type: bool
      source: [user]
    - id: leave_notice_given                 # same id as in wants_to_leave_early: one notice, asked once
      type: bool
      source: [user]
      applies_if: early_or_periodic
    - id: leave_notice_sent_by
      type: choice
      source: [user]
      applies_if: leave_notice_given
      choices:
        - handed to the landlord or the office
        - regular mail
        - certified mail
        - e-mail
        - a resident portal request or message
        - a text message
        - something else

  clocks:
    - id: return_if_no_claim
      actor: landlord
      trigger: tenancy_terminated
      days: 15
      direction: after
      cite: "83.49(3)(a)"
      quote: "if the landlord does not intend to impose a claim on the security deposit, the landlord must return the security deposit, together with interest if otherwise required, within 15 days after the termination of the rental agreement"

    - id: claim_notice_deadline
      actor: landlord
      trigger: tenancy_terminated
      days: 30
      direction: after
      cite: "83.49(3)(a)"
      quote: "If the landlord intends to impose a claim on the deposit, the landlord must, within 30 days after the termination of the rental agreement, provide the tenant written notice by certified mail to the tenant’s last known mailing address or by e-mail in accordance with s. 83.505 of his or her intention to impose a claim on the deposit and the reason for imposing the claim."
      consequence: "If the landlord fails to give the required written notice within the 30-day period, he or she forfeits the right to impose a claim upon the security deposit and may not seek a setoff against the deposit but may file an action for damages after returning the security deposit to the tenant."

    - id: tenant_seven_day_notice
      actor: tenant
      trigger: vacated
      days: 7
      direction: before
      applies_if: early_or_periodic
      cite: "83.49(5)"
      quote: "must give at least 7 days’ written notice by certified mail or personal delivery to the landlord before vacating or abandoning the premises, which notice must include the address where the tenant may be reached"
      consequence: "Failure to give such notice relieves the landlord of the notice requirement of paragraph (3)(a) but does not waive any right the tenant may have to the security deposit or any part of it."

  lease_overrides:
    - clock: tenant_seven_day_notice
      lease_field: notice_before_vacating     # new field for cell 3
      cite: "83.49(5)"
      quote: "Except when otherwise provided by the terms of a written rental agreement"

  exclusions:
    - cite: "83.49(4)"
      quote: "This section does not apply to transient rentals by hotels or motels as defined in chapter 509 or in those instances in which the amount of rent or deposit, or both, is regulated by law or by rules or regulations of a public body"
    - cite: "83.42"
      quote: null
      note: Not yet read. Check whether university-owned housing is excluded from Part II.

  related_issues:
    - issue: deposit_claim_received
      when: {fact: claim_notice_received, equals: true}   # added once this fact is confirmed so

  open_questions:
    - id: termination_date_meaning
      sections: ["83.49"]
      text: >-
        The 15-day and 30-day clocks run from "termination of the rental agreement." The text does not say whether
        that is the lease end date or the move-out date when the two differ; when they are the same day the
        question does not arise. The tool computes from the date the tenant confirmed as the end or termination of
        the lease and records the move-out date beside it.
      readings:
        - >-
          The lease end date: 83.49(3)(a) begins "Upon the vacating of the premises for termination of the rental
          agreement", naming vacating and termination as two things, and 83.49(5) speaks of a tenant who "vacates or
          abandons the premises before the expiration of the term", so leaving early does not by itself end the
          agreement.
        - >-
          The move-out date: the disclosure 83.49(2)(d) requires tells the tenant that the landlord must give notice
          "WITHIN 30 DAYS AFTER YOU MOVE OUT", which reads the same clock as running from the day the tenant leaves.

  # What the tenant can do, and what decides whether it is open (TODO item 81): checked by code
  # (deterministic.check_options) from the confirmed facts, the clocks, and the lease profile, and given to the model
  # before any step toward it. A gate is met through any of its ways. The gates are the author's to check.
    - id: email_notice_conditions
      sections: ["83.49", "83.505"]
      text: >-
        83.49(3)(a) names two ways to give the notice of claim: "by certified mail to the tenant’s last known mailing
        address or by e-mail in accordance with s. 83.505". 83.505(1) allows e-mail only "if the parties have signed an
        addendum to the rental agreement". Apply these to how the record says the notice came; if
        the tenant has not said whether they signed such an addendum, that condition is not known yet. What stays
        open is a notice that reached the tenant in time some other way.
      readings:
        - >-
          A notice given another way is not "the required written notice", and "If the landlord fails to give the
          required written notice within the 30-day period, he or she forfeits the right to impose a claim upon the
          security deposit".
        - >-
          A notice the tenant actually received in time is enough: 83.505(6) says the section "does not preclude
          service of notices by any other means permitted by law", and the tenant had what the notice is for.

  options:
    - id: whole_deposit_back
      label: Get the whole deposit back because the landlord gave no notice of a claim within the 30 days
      cite: "83.49(3)(a)"
      gates:
        - says: the landlord gave the tenant no written notice of a claim on the deposit
          cite: "83.49(3)(a)"
          quote: "If the landlord fails to give the required written notice within the 30-day period, he or she forfeits the right to impose a claim upon the security deposit"
          ways:
            - fact: claim_notice_received
              equals: false
              when_otherwise: >-
                The tenant confirmed receiving something in writing about keeping part of the deposit, by certified mail;
                whether it came in time belongs to the landlord's claim, its own issue.
            - says: the notice came some other way than by certified mail, and whether a notice given that way is the required written notice is not settled
              cite: "83.49(3)(a)"
              quote: "by certified mail to the tenant’s last known mailing address or by e-mail in accordance with s. 83.505"
              open_question: email_notice_conditions
              applies_if:
                fact: claim_delivery
                equals:
                  - regular mail
                  - e-mail
                  - handed to you
                  - a text or a resident portal message
                  - something else
            - says: how the notice came is not known yet
              check: how the notice came; the envelope (a certified mail label or receipt) or the e-mail shows it
              applies_if:
                fact: claim_delivery
                equals:
                  - I don't know
        - says: the 30 days after the end of the rental agreement have passed
          cite: "83.49(3)(a)"
          quote: "within 30 days after the termination of the rental agreement"
          ways:
            - clock: claim_notice_deadline
              equals: passed
              otherwise: later
              when_otherwise: The program's deadlines show the 30 days have not passed yet, so a notice of a claim may still come in time.
        - says: the landlord was not relieved of that notice, as 83.49(5) relieves the landlord of a tenant who left early, or on a periodic tenancy, without 7 days' written notice
          cite: "83.49(5)"
          quote: "Failure to give such notice relieves the landlord of the notice requirement of paragraph (3)(a)"
          ways:
            - says: the tenant did not move out before the lease's end, and the tenancy was not month to month or another periodic one
              fact: early_or_periodic
              equals: false
              when_otherwise: The tenant confirmed moving out before the lease's end, or a periodic tenancy.
            - says: the tenant gave the landlord 7 days' written notice, by certified mail or in person, with an address
              cite: "83.49(5)"
              quote: "must give at least 7 days’ written notice by certified mail or personal delivery to the landlord before vacating or abandoning the premises, which notice must include the address where the tenant may be reached"
              check: >-
                whether the notice reached the landlord at least 7 days before you moved out (the program's deadlines
                show the last day) and gave the address where you can be reached
              applies_if:
                fact: leave_notice_sent_by
                equals:
                  - handed to the landlord or the office
                  - certified mail
            - says: the tenant e-mailed that notice, which counts only as 83.505 allows
              check: >-
                whether you and the landlord signed an addendum agreeing to notices by e-mail, as 83.505 describes, and
                whether the notice reached the landlord at least 7 days before you moved out with the address where you
                can be reached
              lease: notices_to_landlord
              applies_if:
                fact: leave_notice_sent_by
                equals: [e-mail]
            - says: the notice went some other way
              check: how your notice reached the landlord, beside the ways 83.49(5) names, certified mail or personal delivery
              applies_if:
                fact: leave_notice_sent_by
                equals: [something else]
            - says: the lease provides otherwise on notice before moving out, and the tenant followed it
              cite: "83.49(5)"
              quote: "Except when otherwise provided by the terms of a written rental agreement"
              check: whether the lease sets its own terms on notice before moving out, and whether the tenant followed them
              lease: notice_before_vacating
      steps: []
      also_open: [termination_date_meaning]

# ---------- read by the model ----------
guidance:
  questions:
    deposit_amount: How much was your security deposit?
    tenancy_terminated: What date did the lease end, or what date was it terminated?
    vacated: What date did you move out and return the keys?
    claim_notice_received: Have you received anything in writing from the landlord about keeping part of the deposit (a letter, an e-mail, a text, a portal message)?
    claim_notice_date: What date did you receive the landlord's written notice about keeping part of the deposit?
    claim_delivery: How did the landlord's notice about keeping part of the deposit reach you?
    forwarding_address_given: Did you give the landlord your new mailing address in writing?
    early_or_periodic: Did you move out before the lease end date, or was this a month-to-month arrangement?
    leave_notice_given: Have you given the landlord anything in writing saying you are moving out?
    leave_notice_sent_by: How did that written notice reach the landlord?

  lease_checks:
    security_deposit: Confirms the amount and that it was called a deposit.
    nonrefundable_fees: Money labeled nonrefundable may fall under 83.491 instead. Do not treat it as outside 83.49 without reading 83.491.
    forwarding_address_requirement: The landlord's notice goes to the "last known mailing address".
    move_out_requirements: Cleaning and carpet clauses are the usual basis of a claim.
    notices_to_landlord: Where the tenant's letter must be sent.
    joint_and_several_liability: Whether one roommate's damage can be charged against the whole deposit.

  evidence:
    - proof of deposit payment
    - move-out date (key receipt, walkthrough form, last utility bill)
    - move-in and move-out photos
    - forwarding-address notice with delivery proof
    - any landlord letters or emails, with envelope or full headers

  postures:
    core: [today's date, obligation identified, amount and return address, response deadline computed by the tool, delivery method]
    preserve: States move-out date, amount, forwarding address. Asks for return. Cites nothing.
    assert: Adds the 83.49(3)(a) obligation, quoted.
    escalate: Adds the forfeiture consequence, quoted, and 83.49(3)(c) fee-shifting.
    notice_sufficiency: 'Sending this letter does not start any deadline that this tool computes for this issue. The only notice from a tenant that this tool tracks here is in Fla. Stat. 83.49(5), which says that "any tenant who vacates or abandons the premises before the expiration of the term specified in the rental agreement" "must give at least 7 days’ written notice by certified mail or personal delivery to the landlord before vacating or abandoning the premises". The same sentence also covers week-to-week, month-to-month, and other periodic tenancies. Whether it applies to you turns on when you moved out and on your lease (the sentence begins "Except when otherwise provided by the terms of a written rental agreement"); ask in the chat to have it applied to your confirmed facts.'

  failure_modes:
    - Applying either clock without saying which date it counts from, or using the lease end date without the move-out date beside it.
    - Saying the landlord "forfeits the right to impose a claim upon the security deposit" unless the record shows both conditions, that the tenant confirmed no notice of claim arrived and that get_deadlines lists the 30-day notice date as passed; never your own count.
    - Stopping at the forfeiture. The same sentence lets the landlord "file an action for damages after returning the security deposit to the tenant".
    - Applying 83.49(3)(a) to an early move-out or a periodic tenancy without 83.49(5), whose missing 7-day notice "relieves the landlord of the notice requirement of paragraph (3)(a)".
    - Promising fees and costs without the condition in 83.49(3)(c), which applies when "either party institutes an action in a court of competent jurisdiction to adjudicate the party’s right to the security deposit", and then to the prevailing party.
    - Treating a "nonrefundable fee" as outside 83.49 without reading 83.491.
    - Computing any date outside compute_deadlines.
