issue: notice_received_nonpayment
description: Tenant received a landlord's written demand for unpaid rent or possession (the 3-day notice).
sections: ["83.56", "83.60", "83.42"]   # the statute sections this playbook rests on; loaded into the prompt

provenance:
  statute_year: 2026
  verified_against: statutes/83.56.txt, statutes/83.60.txt, statutes/83.42.txt
  verified_by: null          # your name, once you've read each quote against the file
  verified_on: null
  version: 0.6

counting:
  convention: court business days, trigger day not counted, Saturdays, Sundays, and the circuit's court holidays skipped (calendars/)
  status: ASSUMPTION. The counting rule and which holidays count are open questions (see open_questions). Show the counting line with every computed date.
  note: 83.56(3) is computed in court business days from the circuit's holiday memorandum. 83.60(2) is not computed; whether its "legal holidays" are the same list is an open question.

# ---------- read by code ----------
spec:
  elements:
    - id: nonpayment_notice_delivered
      type: date
      source: [user]
    - id: nonpayment_notice_method
      type: text
      source: [user]
    - id: notice_stated_payment_date
      type: date
      source: [user]
    - id: amount_demanded
      type: money
      source: [user]
    - id: monthly_rent
      type: money
      source: [lease_profile.rent, user]
    - id: rent_unpaid
      type: bool
      source: [user]
    - id: partial_rent_accepted
      type: bool
      source: [user]
    - id: partial_payment_receipt
      type: bool
      source: [user]
      applies_if: partial_rent_accepted
    - id: withheld_for_repairs
      type: bool
      source: [user]
    - id: premises_county
      type: text
      source: [user]
    - id: eviction_action_filed
      type: bool
      source: [user]
    - id: court_papers_served
      type: date
      source: [user]
      applies_if: eviction_action_filed
    - id: registry_paid
      type: bool
      source: [user]
      applies_if: eviction_action_filed

  clocks:
    - id: three_day_demand_period
      actor: tenant
      trigger: nonpayment_notice_delivered
      days: 3
      direction: after
      count: court_business_days
      shown_with: notice_stated_payment_date   # printed beside the computed date, as the open question below says
      cite: "83.56(3)"
      quote: "If the tenant fails to pay rent when due and the default continues for 3 days, excluding Saturday, Sunday, and legal holidays, after delivery of written demand by the landlord for payment of the rent or possession of the premises, the landlord may terminate the rental agreement."
      consequence: "Legal holidays for the purpose of this section shall be court-observed holidays only."

  lease_overrides:
    - cite: "83.56(4)"
      quote: "The notice requirements of subsections (1)-(3) may not be waived in the rental agreement."
      note: The lease cannot waive the notice. The tool shows the sentence next to any lease clause about notices.

  exclusions:
    - cite: "83.56(5)(a)"
      quote: "However, a landlord does not waive the right to terminate the rental agreement or to bring a civil action for that noncompliance by accepting partial rent for the period."
    - cite: "83.42(1)"
      quote: "Residency or detention in a facility, whether public or private, when residence or detention is incidental to the provision of medical, geriatric, educational, counseling, religious, or similar services."
      note: College housing. The tool records the facts and does not decide whether this exclusion applies.

  related_issues:
    - issue: repair_not_made
      when: {fact: withheld_for_repairs, equals: true}   # added once this fact is confirmed so

  open_questions:
    - id: counting_rule
      sections: ["83.56"]
      text: >-
        83.56(3) counts "3 days, excluding Saturday, Sunday, and legal holidays, after delivery of written demand by
        the landlord for payment of the rent or possession of the premises". The tool counts forward from the delivery
        date, the delivery day not counted, and shows the date the notice itself states next to it. How the days are
        counted (the delivery day, delivery on a weekend or holiday, when the last day ends) is an open question the
        author is researching. Show the counting line with the date and do not settle it.
    - id: court_observed_holidays
      sections: ["83.56"]
      text: >-
        83.56(3) says "Legal holidays for the purpose of this section shall be court-observed holidays only." The tool
        skips every holiday in the circuit Chief Judge's memorandum for the year, including those marked as designated
        by the Chief Judge and those it marks as additional discretionary holidays. Whether each of those is a
        court-observed holiday in the statute's sense is an open question. Calendars are stored only for the counties
        in calendars/; for any other county, or a year with no memorandum, the date is not computed.
    - id: registry_count
      sections: ["83.60"]
      text: >-
        Once an eviction case is served, 83.60(2) requires a tenant who raises "any defense other than payment" to pay
        the rent into the registry of the court, within "5 days, excluding Saturdays, Sundays, and legal holidays,
        after the date of service of process". Apply the requirement itself when the record shows court papers were
        served. The definition of legal holidays in 83.56(3) is stated "for the purpose of this section", and whether
        83.60(2) uses the same list is an open question, so the tool does not compute this date.
    - id: notice_form
      sections: ["83.56", "83.60"]
      text: >-
        83.56(3) says the notice "shall contain a statement in substantially the following form". Set what the record
        says the notice states (the amount demanded, the date to pay by, how it was delivered) beside the form's
        parts. A defect does not end a case by itself: 83.60(1)(a) says "The landlord must be given an opportunity to
        cure a deficiency in a notice or in the pleadings before dismissal of the action." What stays open is how far a
        notice may differ and still be in substantially that form, whether it may demand more than rent, and whether
        it may add terms the form does not have, such as how, where, or in what form the rent must be paid.
      readings:
        - >-
          A notice that leaves out a part of the form (the county, the excluded days, the date to pay by), demands
          charges other than rent, or adds a term the form does not have (cash only, a money order, one office) is
          not in substantially the form, since the form demands only "the sum of dollars for the rent and use of the
          premises".
        - >-
          Substantially allows differences that do not mislead the tenant about how much, by when, and to whom, and
          charges the lease itself calls rent may be demanded as rent.
    - id: partial_rent_steps
      sections: ["83.56"]
      text: >-
        If partial rent is accepted after the notice, 83.56(5)(a) says the landlord does not waive "by accepting
        partial rent for the period", and lists what the landlord must then do ("If partial rent is accepted after
        posting the notice for nonpayment, the landlord must:"): a receipt, the money into the court registry on
        filing, or a new 3-day notice. Apply the list to the record;
        the sheet asks only about the receipt, so the other two steps are not known yet unless the tenant says.

  # What the tenant can do, and what decides whether it is open (TODO item 81): checked by code
  # (deterministic.check_options) from the confirmed facts and the clocks, and given to the model before any step
  # toward it. A gate is met through any of its ways. The gates are the author's to check.
  options:
    - id: pay_within_three_days
      label: Pay the rent the notice demands before the 3 days end, so the landlord may not end the rental agreement on this notice
      cite: "83.56(3)"
      gates:
        - says: the 3 days after the notice was delivered, excluding Saturday, Sunday, and legal holidays, have not ended
          cite: "83.56(3)"
          quote: "If the tenant fails to pay rent when due and the default continues for 3 days, excluding Saturday, Sunday, and legal holidays, after delivery of written demand by the landlord for payment of the rent or possession of the premises, the landlord may terminate the rental agreement."
          ways:
            - clock: three_day_demand_period
              equals: upcoming
              when_otherwise: The program's deadlines show the 3 days have passed; after that the statute lets the landlord end the rental agreement.
      steps:
        - says: the rent the notice demands is paid
          cite: "83.56(3)"
          quote: "demand payment of the rent or possession of the premises within 3 days"
          fact: rent_unpaid
          equals: false
      also_open: [counting_rule, court_observed_holidays, notice_form]

    - id: defend_in_court
      label: Raise a defense other than payment in an eviction case, such as the landlord's failure to repair or retaliation
      cite: "83.60(2)"
      gates:
        - says: the landlord has filed an eviction case
          cite: "83.60(2)"
          quote: "In an action by the landlord for possession of a dwelling unit, if the tenant interposes any defense other than payment"
          ways:
            - fact: eviction_action_filed
              equals: true
              otherwise: later
              when_otherwise: The tenant confirmed no eviction case has been filed; a defense is raised in a case once one is filed.
      steps:
        - says: the rent the court papers claim is paid into the registry of the court, or a motion to determine the amount is filed, within 5 days after service, excluding Saturdays, Sundays, and legal holidays
          cite: "83.60(2)"
          quote: "Failure of the tenant to pay the rent into the registry of the court or to file a motion to determine the amount of rent to be paid into the registry within 5 days, excluding Saturdays, Sundays, and legal holidays, after the date of service of process constitutes an absolute waiver of the tenant’s defenses other than payment"
          fact: registry_paid
          equals: true
      also_open: [registry_count]

    - id: defective_notice_defense
      label: Defend an eviction case on the ground that the 3-day notice is defective
      cite: "83.60(2)"
      gates:
        - says: the notice is not in substantially the form 83.56(3) gives
          cite: "83.56(3)"
          quote: "The 3-day notice shall contain a statement in substantially the following form"
          ways:
            - check: >-
                the notice itself, part by part, against the form in 83.56(3): the sum demanded for the rent and use of
                the premises, the address with the county, the 3 days excluding Saturday, Sunday, and legal holidays, the
                date to pay by, and the landlord's name, address, and phone number
        - says: the landlord has filed an eviction case
          cite: "83.60(2)"
          quote: "In an action by the landlord for possession of a dwelling unit, if the tenant interposes any defense other than payment"
          ways:
            - fact: eviction_action_filed
              equals: true
              otherwise: later
              when_otherwise: The tenant confirmed no eviction case has been filed; a defense is raised in a case once one is filed.
      steps:
        - says: the rent the court papers claim is paid into the registry of the court, or a motion to determine the amount is filed, within 5 days after service, excluding Saturdays, Sundays, and legal holidays
          cite: "83.60(2)"
          quote: "Failure of the tenant to pay the rent into the registry of the court or to file a motion to determine the amount of rent to be paid into the registry within 5 days, excluding Saturdays, Sundays, and legal holidays, after the date of service of process constitutes an absolute waiver of the tenant’s defenses other than payment"
          fact: registry_paid
          equals: true
      also_open: [notice_form, registry_count]

# ---------- read by the model ----------
guidance:
  questions:
    nonpayment_notice_delivered: What date was the landlord's notice demanding rent delivered to you (or left at your home)?
    nonpayment_notice_method: How did the notice reach you (handed to you, mailed, e-mailed, left at your door, something else)?
    notice_stated_payment_date: What date does the notice give as the last day to pay or leave? Copy it from the notice.
    amount_demanded: How much does the notice say you owe?
    monthly_rent: How much is your monthly rent?
    rent_unpaid: Is any of the rent the notice asks for still unpaid?
    partial_rent_accepted: After the notice was delivered, did you pay part of the rent, and did the landlord accept it?
    partial_payment_receipt: Did the landlord give you a receipt showing the date, the amount received, and the agreed date and balance still due?
    withheld_for_repairs: Did you hold back rent because the landlord did not make repairs?
    premises_county: What county is the rental in? (For example, Alachua.)
    eviction_action_filed: Has the landlord filed an eviction case in court against you?
    court_papers_served: What date were you served with the court papers?
    registry_paid: Have you paid the rent the court papers claim into the court registry, or filed a motion asking the court to decide the amount?

  lease_checks:
    rent: The rent amount and due date, next to the amount the notice demands.
    notices_to_landlord: Where the tenant's reply must be sent under the lease.

  evidence:
    - the notice itself, with a photo of where it was left or the envelope or e-mail headers
    - rent receipts, bank or payment app records for the months in question
    - any receipt for partial rent the landlord accepted
    - any written notice about repairs sent before rent was held back
    - court papers, if served, with the date of service

  postures:
    core: [today's date, the amount demanded, what the tenant has paid and when, the tenant's reply, delivery method]
    preserve: States the amount demanded and what the tenant has paid, and asks the landlord for an account of the balance. Cites nothing.
    assert: Adds the 83.56(5)(a) sentence on partial rent, quoted.
    escalate: Adds the 83.60(1)(a) sentence on defenses, quoted.
    notice_sufficiency: >-
      A letter from you does not change the period in Fla. Stat. 83.56(3), which runs "after delivery of written
      demand by the landlord for payment of the rent or possession of the premises" and counts "3 days,
      excluding Saturday, Sunday, and legal holidays". This tool computed that date from the delivery date you
      gave, skipping the holidays in your court circuit's published calendar, and shows it next to the date
      your notice states. How the days are counted is stated with the date as an assumption.

  failure_modes:
    - Counting the 3 days yourself, in calendar days or with holidays; only get_deadlines computes the date, and whether it has passed comes from its listing.
    - Giving the computed date without its counting line, or without the date the notice itself states.
    - Saying the tenant has a defense in court without 83.60(2), or giving 83.60(2)'s registry payment without its other step. What waives the defenses other than payment is failing to pay the rent into the registry "or to file a motion to determine the amount of rent to be paid into the registry", which "constitutes an absolute waiver of the tenant’s defenses other than payment".
    - Treating an accepted partial payment as ending the notice; 83.56(5)(a) says the landlord does not waive "by accepting partial rent for the period".
    - Reading 83.56(5)(a)'s steps after partial rent as settled on the record, or as all due before filing. The receipt comes "before filing an action for possession", the partial rent goes into the registry "upon filing the action for possession", and the list ends "or 3. Post a new 3-day notice reflecting the new amount due". Which step the landlord took is a fact the record must show.
    - Saying a defective notice ends the case; 83.60(1)(a) gives the landlord "an opportunity to cure a deficiency in a notice" first.
    - Applying the repair defense in 83.60(1)(b) without the written notice it requires, "indicating the intention of the tenant not to pay rent by reason thereof"; the repair issue's facts hold it.
    - Not asking whether court papers have been served.
