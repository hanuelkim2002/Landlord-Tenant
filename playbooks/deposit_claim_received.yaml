issue: deposit_claim_received
description: Tenant has received the landlord's written notice that the landlord intends to keep all or part of the security deposit (a claim on the deposit).
sections: ["83.49", "83.505"]   # the statute sections this playbook rests on; loaded into the prompt

provenance:
  statute_year: 2026
  verified_against: statutes/83.49.txt
  verified_by: null          # your name, once you've read each quote against the file
  verified_on: null
  version: 0.5

counting:
  convention: calendar days, trigger day not counted, no weekend or holiday adjustment
  status: ASSUMPTION. Florida's court rule for counting days has not been checked against statutory deadlines outside litigation. Show this line with every computed date.

# ---------- read by code ----------
spec:
  elements:
    - id: deposit_amount
      type: money
      source: [lease_profile.security_deposit, user]
    - id: tenancy_terminated
      type: date
      source: [user]
      compare_to: lease_profile.term_end      # shown next to the tenant's date when they differ
    - id: claim_notice_dated
      type: date
      source: [user]
    - id: claim_notice_date                  # same id as in deposit_not_returned: asked once, shared
      type: date
      source: [user]
    - id: claim_delivery                     # same id as in deposit_not_returned: asked once, shared
      type: choice
      source: [user]
      choices:
        - certified mail
        - regular mail
        - e-mail
        - handed to you
        - a text or a resident portal message
        - something else
        - I don't know
    - id: claim_amount
      type: money
      source: [user]
    - id: claim_reason
      type: text
      source: [user]
    - id: notice_states_objection_window
      type: bool
      source: [user]
    - id: objected
      type: bool
      source: [user]
    - id: objection_date
      type: date
      source: [user]
      applies_if: objected
    - id: objection_sent_by
      type: choice
      source: [user]
      applies_if: objected
      choices:
        - a letter mailed to the address the notice gives
        - a letter handed in at the address the notice gives
        - a letter to another address
        - e-mail
        - a text or a resident portal message
        - something else

  clocks:
    - id: claim_notice_deadline
      actor: landlord
      trigger: tenancy_terminated
      days: 30
      direction: after
      cite: "83.49(3)(a)"
      quote: "If the landlord intends to impose a claim on the deposit, the landlord must, within 30 days after the termination of the rental agreement, provide the tenant written notice by certified mail to the tenant’s last known mailing address or by e-mail in accordance with s. 83.505 of his or her intention to impose a claim on the deposit and the reason for imposing the claim."
      consequence: "If the landlord fails to give the required written notice within the 30-day period, he or she forfeits the right to impose a claim upon the security deposit and may not seek a setoff against the deposit but may file an action for damages after returning the security deposit to the tenant."

    - id: tenant_objection_deadline
      actor: tenant
      trigger: claim_notice_date
      days: 15
      direction: after
      cite: "83.49(3)(b)"
      quote: "Unless the tenant objects to the imposition of the landlord’s claim or the amount thereof within 15 days after receipt of the landlord’s notice of intention to impose a claim, the landlord may then deduct the amount of his or her claim and shall remit the balance of the deposit to the tenant within 30 days after the date of the notice of intention to impose a claim for damages."
      consequence: "The failure of the tenant to make a timely objection does not waive any rights of the tenant to seek damages in a separate action."

    - id: landlord_remit_balance
      actor: landlord
      trigger: claim_notice_dated
      days: 30
      direction: after
      cite: "83.49(3)(b)"
      quote: "shall remit the balance of the deposit to the tenant within 30 days after the date of the notice of intention to impose a claim for damages"
      # The sentence this comes from begins "Unless the tenant objects". The tool computes this date
      # in every case and shows the quote; it does not decide whether the condition is met.

  lease_overrides: []

  exclusions:
    - cite: "83.49(4)"
      quote: "This section does not apply to transient rentals by hotels or motels as defined in chapter 509 or in those instances in which the amount of rent or deposit, or both, is regulated by law or by rules or regulations of a public body"

  related_issues:
    - issue: deposit_not_returned
      when: {fact: claim_notice_received, equals: false}   # added once this fact is confirmed so

  open_questions:
    - id: receipt_date
      sections: ["83.49", "83.505"]
      text: >-
        The objection clock runs from "receipt of the landlord’s notice" while the remit clock runs from "the date of
        the notice". Both dates are recorded and both clocks computed from them. For a notice sent by e-mail,
        83.505(4) says a notice "is deemed delivered at the time it is sent, unless the e-mail is returned to the
        sender as undeliverable"; whether that time is the "receipt" the objection clock counts from is not settled
        by the stored text.
      readings:
        - >-
          Receipt is the time the e-mail was sent: 83.505(4) makes an e-mailed notice "deemed delivered at the time it
          is sent", and a notice delivered is a notice received.
        - >-
          Receipt is when the tenant actually got the notice: 83.49(3)(b) says receipt, not delivery, and the model
          notice tells the tenant to object "within 15 days after the time you receive this notice".
    - id: email_notice_conditions
      sections: ["83.49", "83.505"]
      text: >-
        83.49(3)(a) names two ways to give the notice of claim: "by certified mail to the tenant’s last known mailing
        address or by e-mail in accordance with s. 83.505". 83.505(1) allows e-mail only "if the parties have signed an
        addendum to the rental agreement". Apply these to how the record says the notice came; if
        the tenant has not said whether they signed such an addendum, that condition is not known yet. What stays
        open is a notice that reached the tenant in time some other way.
      readings:
        - >-
          A notice given another way is not "the required written notice", and "If the landlord fails to give the
          required written notice within the 30-day period, he or she forfeits the right to impose a claim upon the
          security deposit".
        - >-
          A notice the tenant actually received in time is enough: 83.505(6) says the section "does not preclude
          service of notices by any other means permitted by law", and the tenant had what the notice is for.
    - id: objection_form
      sections: ["83.49"]
      text: >-
        The statute's model notice says the tenant "must object in writing" and that the objection "must be sent to
        (landlord’s address)". A written objection sent to that address within the 15 days get_deadlines shows meets
        those words. What stays open is an objection made another way (e-mail, text, a resident portal) or sent to
        another address.
      readings:
        - >-
          Only a writing sent to the address the notice gives counts: the form says the objection "must be sent to
          (landlord’s address)".
        - >-
          Any written objection the landlord receives in time counts: 83.49(3)(b) itself turns on whether "the tenant
          objects to the imposition of the landlord’s claim or the amount thereof within 15 days after receipt", and
          names no method.

  # What the tenant can do, and what decides whether it is open (TODO items 81 and 84): checked by code
  # (deterministic.check_options) from the confirmed facts, the clocks, and the lease profile, and given to the model
  # before any step toward it. A gate is met through any of its ways. The gates are the author's to check.
  options:
    - id: object_to_claim
      label: Object in writing to the landlord's claim within 15 days of receiving the notice, so the landlord may not simply deduct it
      cite: "83.49(3)(b)"
      gates:
        - says: the objection is made within the 15 days after the tenant received the notice
          cite: "83.49(3)(b)"
          quote: "Unless the tenant objects to the imposition of the landlord’s claim or the amount thereof within 15 days after receipt of the landlord’s notice of intention to impose a claim, the landlord may then deduct the amount of his or her claim"
          ways:
            - says: the 15 days have not ended
              clock: tenant_objection_deadline
              equals: upcoming
              when_otherwise: >-
                The program's deadlines show the 15 days have passed. Not objecting in time does not waive the tenant's
                right to seek damages in a separate action.
            - says: the objection already sent went out within the 15 days
              applies_if: objected
              check: the date the objection was sent, beside the last day of the 15 days the program's deadlines show
      steps:
        - says: a written objection to the claim or its amount, sent to the address the notice gives
          cite: "83.49(3)(a)"
          quote: "You are hereby notified that you must object in writing to this deduction from your security deposit within 15 days after the time you receive this notice"
          ways:
            - says: the objection went as a letter to the address the notice gives
              fact: objection_sent_by
              equals:
                - a letter mailed to the address the notice gives
                - a letter handed in at the address the notice gives
              otherwise: unsettled
              open_question: objection_form
              when_otherwise: The objection went another way or to another address; whether that counts is not settled.
      also_open: [receipt_date, objection_form]

    - id: whole_deposit_back
      label: Get the whole deposit back because the landlord did not give the required notice of a claim within the 30 days
      cite: "83.49(3)(a)"
      gates:
        - says: the 30 days after the end of the rental agreement have passed
          cite: "83.49(3)(a)"
          quote: "within 30 days after the termination of the rental agreement"
          ways:
            - clock: claim_notice_deadline
              equals: passed
              otherwise: later
              when_otherwise: The program's deadlines show the 30 days have not passed yet, so a notice of a claim may still come in time.
        - says: the notice the landlord gave was not the required notice within those 30 days
          cite: "83.49(3)(a)"
          quote: "If the landlord fails to give the required written notice within the 30-day period, he or she forfeits the right to impose a claim upon the security deposit"
          ways:
            - says: the notice was sent after the 30 days
              check: the date the notice was sent (its postmark, or the e-mail's date), beside the last day of the 30 days the program's deadlines show
            - says: the notice did not come by certified mail to the last known mailing address or by e-mail as 83.505 allows, and that makes it not the required notice
              cite: "83.49(3)(a)"
              quote: "by certified mail to the tenant’s last known mailing address or by e-mail in accordance with s. 83.505"
              open_question: email_notice_conditions
              applies_if:
                fact: claim_delivery
                equals:
                  - regular mail
                  - e-mail
                  - handed to you
                  - a text or a resident portal message
                  - something else
            - says: how the notice came is not known yet
              check: how the notice came; the envelope (a certified mail label or receipt) or the e-mail shows it
              applies_if:
                fact: claim_delivery
                equals:
                  - I don't know
      steps: []
      also_open: [receipt_date]

# ---------- read by the model ----------
guidance:
  questions:
    deposit_amount: How much was your security deposit?
    tenancy_terminated: What date did the lease end, or what date was it terminated?
    claim_notice_dated: What date is printed on the landlord's notice?
    claim_notice_date: What date did you receive the landlord's written notice about keeping part of the deposit?
    claim_delivery: How did the landlord's notice about keeping part of the deposit reach you?
    claim_amount: How much does the notice say the landlord is claiming from the deposit?
    claim_reason: What reason does the notice give for the claim? Copy the words from the notice.
    notice_states_objection_window: Does the notice tell you that you must object in writing within 15 days, and give an address to send the objection to?
    objected: Have you already sent the landlord a written objection to the claim?
    objection_date: What date did you send the objection?
    objection_sent_by: How did your objection reach the landlord?

  lease_checks:
    security_deposit: Confirms the amount and that it was called a deposit.
    deposit_deductions: What the lease says the landlord may deduct for. Compare against the reason in the notice.
    move_out_requirements: Cleaning and carpet clauses are the usual basis of a claim.
    nonrefundable_fees: Money labeled nonrefundable may fall under 83.491 instead. Do not treat it as outside 83.49 without reading 83.491.
    notices_to_landlord: Where the tenant's objection must be sent under the lease, alongside the address given in the notice.
    joint_and_several_liability: Whether one roommate's damage can be charged against the whole deposit.

  evidence:
    - the notice itself, with the envelope or the full e-mail headers
    - the date the notice arrived (postmark, delivery scan, e-mail timestamp)
    - move-in and move-out photos
    - move-out walkthrough form, if any
    - receipts for cleaning or repairs the tenant paid for
    - the objection letter with proof of how and when it was sent

  postures:
    core: [today's date, the claim amount and reason as stated in the notice, the tenant's objection, the deposit amount, a return address, response deadline computed by the tool, delivery method]
    preserve: States that the tenant objects to the claim, the amount, and the reason. Asks for return of the full deposit. Cites nothing.
    assert: Adds the 83.49(3)(b) sentence on the 15-day objection, quoted.
    escalate: Adds the 83.49(3)(c) sentence on court costs and attorney fees, quoted.
    notice_sufficiency: For this issue your letter is the objection itself. The statute sentence on objections is quoted above, and the tool has computed the 15-day date from the day you said you received the notice. If it is sent after that date, 83.49(3)(b) says the failure to object in time "does not waive any rights of the tenant to seek damages in a separate action".

  failure_modes:
    - Counting the objection window from the date printed on the notice, or the remit window from the date it was received; get_deadlines counts each from its own date.
    - Treating the remit clock as unconditional. It comes from a sentence that begins "Unless the tenant objects".
    - Saying the tenant lost the deposit by not objecting in time. 83.49(3)(b) says "The failure of the tenant to make a timely objection does not waive any rights of the tenant to seek damages in a separate action."
    - Saying the claim is forfeited unless the record shows the notice came after the 30-day date get_deadlines lists, or by a way 83.49(3)(a) does not name.
    - Judging the claim's amount by a standard neither the lease nor 83.49 states. 83.49 sets the notice and objection steps, not what damage a landlord may charge for; "normal wear and tear" appears in the stored text only in 83.491, the fee in lieu of a deposit. Set the claim's reason beside the lease's move-out clauses and the tenant's account.
    - Computing any date outside compute_deadlines.
