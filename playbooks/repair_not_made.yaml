issue: repair_not_made
description: Something in the unit needs repair and the landlord has not fixed it.
sections: ["83.51", "83.56", "83.60", "83.64", "83.42", "83.505"]   # the statute sections this playbook rests on; loaded into the prompt

provenance:
  statute_year: 2026
  verified_against: statutes/83.51.txt, statutes/83.56.txt, statutes/83.60.txt, statutes/83.42.txt, statutes/83.505.txt
  verified_by: null          # your name, once you've read each quote against the file
  verified_on: null
  version: 0.6

counting:
  convention: calendar days, trigger day not counted, no weekend or holiday adjustment
  status: ASSUMPTION. Florida's court rule for counting days has not been checked against statutory deadlines outside litigation. Show this line with every computed date.

# ---------- read by code ----------
spec:
  elements:
    - id: problem_description
      type: text
      source: [user]
    - id: problem_is_with
      type: choice
      source: [user]
      choices:
        - the roof
        - a window or a door
        - a floor, steps, or a porch
        - an outside wall or the foundation
        - another part of the building's structure
        - pipes, drains, toilets, or faucets
        - heat
        - running water
        - hot water
        - the air conditioning
        - an appliance (a washer, a refrigerator, a stove)
        - pests (roaches, rats, bedbugs)
        - locks or keys
        - electrical (outlets, lights, wiring)
        - mold
        - a common area (a hallway, a stairwell, a laundry room)
        - something else
    - id: problem_started
      type: date
      source: [user]
    - id: single_family_or_duplex
      type: bool
      source: [user]
    - id: caused_by
      type: choice
      source: [user]
      choices:
        - nothing anyone did (age, wear, weather)
        - the landlord or its workers
        - you
        - a family member who lives with you
        - a guest or someone else you let in
        - a roommate
        - someone you did not let in (a neighbor, a stranger)
        - I don't know
    - id: wrote_to_landlord
      type: bool
      source: [user]
    - id: message_sent_by
      type: choice
      source: [user]
      applies_if: wrote_to_landlord
      choices:
        - handed to the landlord or the office
        - regular mail
        - certified mail
        - e-mail
        - a resident portal request or message
        - a text message
        - something else
    - id: message_date
      type: date
      source: [user]
      applies_if: wrote_to_landlord
    - id: message_mentions_ending
      type: bool
      source: [user]
      applies_if: wrote_to_landlord
    - id: message_mentions_rent
      type: bool
      source: [user]
      applies_if: wrote_to_landlord
    - id: message_words
      type: text
      source: [user]
      applies_if: wrote_to_landlord
    - id: rent_paid_since_known
      type: bool
      source: [user]
    - id: landlord_response
      type: text
      source: [user]
    - id: eviction_action_filed
      type: bool
      source: [user]

  clocks:
    - id: seven_days_after_termination_notice
      actor: landlord
      trigger: message_date
      days: 7
      direction: after
      applies_if: message_mentions_ending
      cite: "83.56(1)"
      quote: "If the landlord materially fails to comply with s. 83.51 (1) or material provisions of the rental agreement within 7 days after delivery of written notice by the tenant specifying the noncompliance and indicating the intention of the tenant to terminate the rental agreement by reason thereof, the tenant may terminate the rental agreement."
      condition: >-
        your message was delivered in a way 83.56(4) allows and says you intend to end the lease because of the
        problem, which this tool does not decide

    - id: seven_days_after_withholding_notice
      actor: landlord
      trigger: message_date
      days: 7
      direction: after
      applies_if: message_mentions_rent
      cite: "83.60(1)(b)"
      quote: "The defense of a material noncompliance with s. 83.51 (1) may be raised by the tenant if 7 days have elapsed after the delivery of written notice by the tenant to the landlord, specifying the noncompliance and indicating the intention of the tenant not to pay rent by reason thereof."
      consequence: "A material noncompliance with s. 83.51 (1) by the landlord is a complete defense to an action for possession based upon nonpayment of rent"
      condition: >-
        your message was delivered to the landlord and says you intend not to pay rent because of the problem,
        which this tool does not decide

  lease_overrides:
    - cite: "83.51(1)"
      quote: "The landlord’s obligations under this subsection may be altered or modified in writing with respect to a single-family home or duplex."
      note: Check the lease for a written change to the landlord's duty. The tool does not decide its effect.

  exclusions:
    - cite: "83.51(2)(c)"
      quote: "Nothing in this part authorizes the tenant to raise a noncompliance by the landlord with this subsection as a defense to an action for possession under s. 83.59 ."
      note: Applies to the items in 83.51(2) (extermination, locks and keys, common areas, garbage, heat, running water, hot water).
    - cite: "83.51(4)"
      quote: "The landlord is not responsible to the tenant under this section for conditions created or caused by the negligent or wrongful act or omission of the tenant, a member of the tenant’s family, or other person on the premises with the tenant’s consent."
    - cite: "83.56(5)(a)"
      quote: "if the tenant pays rent with actual knowledge of a noncompliance by the landlord or accepts performance by the landlord of any other provision of the rental agreement that is at variance with its provisions, the landlord or tenant waives his or her right to terminate the rental agreement or to bring a civil action for that noncompliance, but not for any subsequent or continuing noncompliance."
    - cite: "83.42(1)"
      quote: "Residency or detention in a facility, whether public or private, when residence or detention is incidental to the provision of medical, geriatric, educational, counseling, religious, or similar services."
      note: College housing. The tool records the facts and does not decide whether this exclusion applies.

  related_issues: []

  open_questions:
    - id: which_code_applies
      sections: ["83.51"]
      text: >-
        83.51(1)(a) points to "the requirements of applicable building, housing, and health codes". Those codes are
        not in the stored text, so whether a condition violates a code cannot be applied here; say so. 83.51(1)(b)'s
        list applies "Where there are no applicable building, housing, or health codes".
    - id: material_noncompliance
      sections: ["83.56", "83.60"]
      text: >-
        Both 7-day periods concern a landlord who "materially fails to comply" or a "material noncompliance". The
        stored text does not define "material". Set the record's description of the problem, how long it has lasted,
        and the landlord's response beside the word.
      readings:
        - >-
          A failure is material when it is a failure of a duty 83.51(1) lists (the codes; roofs, windows, doors,
          floors, steps, porches, exterior walls, foundations, other structural parts; the plumbing), whatever its
          size.
        - >-
          Material turns on degree: how serious the condition is, how long it has lasted, and how it affects living in
          the unit, so a failure of a listed duty can still be minor.
    - id: subsection_one_or_two
      sections: ["83.51"]
      text: >-
        83.51(1) covers the codes and the structure and plumbing; 83.51(2)(a) adds, for a unit other than a
        single-family home or duplex and "Unless otherwise agreed in writing", extermination, locks and keys, common
        areas, garbage removal, and heat, running water, and hot water. 83.56(1) and 83.60(1)(b) speak only of 83.51(1),
        and 83.51(2)(c) says part II does not let the tenant raise a noncompliance with subsection (2) as a defense to
        an action for possession. Apply the lists to the problem in the record. What stays
        open is an item subsection (2) names that a code, or the plumbing 83.51(1)(b) names, may also cover, such
        as running water and hot water.
      readings:
        - >-
          It is a subsection (1) duty when a code covers it or it is part of the plumbing, and 83.51(3) says that when
          subsection (1)'s duty is the same or greater, "the landlord’s duty is determined by subsection (1)".
        - >-
          It is a subsection (2) duty because subsection (2) names it, so 83.56(1) and 83.60(1)(b) do not reach it.
    - id: court_procedure
      sections: ["83.60"]
      text: >-
        Once an eviction case is filed, 83.60(2) requires a tenant who raises "any defense other than payment" to pay
        the rent into the registry of the court, within "5 days, excluding Saturdays, Sundays, and legal holidays,
        after the date of service of process". Apply the requirement itself when the record shows a case was filed;
        this tool counts calendar days only and does not compute that date.

    - id: rent_paid_waiver
      sections: ["83.56"]
      text: >-
        83.56(5)(a) says that if the tenant "pays rent with actual knowledge of a noncompliance by the landlord", the
        tenant waives the right "to terminate the rental agreement or to bring a civil action for that noncompliance,
        but not for any subsequent or continuing noncompliance". Set the record beside it: the rent paid since the
        tenant knew of the problem, and whether the problem goes on.
      readings:
        - >-
          A problem the landlord still has not fixed is a continuing noncompliance, so paying rent while it goes on
          does not waive ending the lease over it.
        - >-
          The noncompliance is the landlord's failure to fix the problem the tenant already knew of; paying rent with
          that knowledge waives ending the lease over it, and only a new or different failure starts over.

    - id: roommate_consent
      sections: ["83.51"]
      text: >-
        83.51(4) leaves the landlord not responsible to the tenant for conditions caused by "the negligent or wrongful
        act or omission of the tenant, a member of the tenant’s family, or other person on the premises with the
        tenant’s consent". The stored text does not say whether a roommate is such a person, in particular one the
        landlord placed in the unit. Set the record beside it: who caused the problem, and how the roommate came to
        live there.
      readings:
        - >-
          A roommate who lives in the unit the tenant shares is on the premises with the tenant's consent, so the
          landlord is not responsible to the tenant for a condition the roommate caused by a negligent or wrongful act.
        - >-
          A roommate the landlord placed, under a lease of the roommate's own, is on the premises by the landlord's
          leave, not the tenant's consent, so 83.51(4) does not reach what the roommate caused, and the landlord stays
          responsible to the tenant.

    - id: withholding_notice_delivery
      sections: ["83.60", "83.56", "83.505"]
      text: >-
        83.60(1)(b) runs its 7 days from "the delivery of written notice by the tenant to the landlord" and names who
        may receive it, but names no way of delivering it. 83.56(4)'s ways are for "the written notices required by
        subsections (1)-(3)" of 83.56, and 83.505 lets a party e-mail "any notices required under this part" once both
        have signed its addendum. Set beside it how the tenant's message reached the landlord.
      readings:
        - >-
          83.60(1)(b) names no way, so a written notice that reaches the landlord, or a person it names, is delivered
          however it was sent, by e-mail or the resident portal included.
        - >-
          The ways part II gives for notices apply to this one too, so a notice by e-mail counts only under an 83.505
          addendum, and a resident portal request or a text is not a delivered notice.

  # What the tenant can do, and what decides whether it is open (TODO items 72 and 81): checked by code
  # (deterministic.check_options) from the confirmed facts and the lease profile, and given to the model before any
  # step toward it. A gate is met through any of its ways; each way is a fact, a clock, something the tenant can check,
  # or law outside the tool. The sheet asks only what the tenant saw or did (what the problem is with, who caused it,
  # how a message went, its words); which answers meet a condition is the playbook's reading below, and what no answer
  # settles is a check or an open question (TODO items 86 and 90 to 92). The gates are the author's to check.
  options:
    - id: end_the_lease
      label: End the lease because the landlord has not made the repair
      cite: "83.56(1)"
      gates:
        - says: the landlord had a duty to fix this problem, under 83.51(1) or a material provision of the lease
          cite: "83.56(1)"
          quote: "If the landlord materially fails to comply with s. 83.51 (1) or material provisions of the rental agreement"
          ways:
            - says: the problem is with the structure (roof, windows, doors, floors, steps, porches, exterior walls, foundation) or the plumbing
              cite: "83.51(1)(b)"
              quote: "maintain the roofs, windows, doors, floors, steps, porches, exterior walls, foundations, and all other structural components in good repair and capable of resisting normal forces and loads and the plumbing in reasonable working condition"
              fact: problem_is_with
              equals:
                - the roof
                - a window or a door
                - a floor, steps, or a porch
                - an outside wall or the foundation
                - another part of the building's structure
                - pipes, drains, toilets, or faucets
              when_otherwise: The problem the tenant picked is not one of the parts 83.51(1)(b) names outright, the structural parts and the plumbing.
            - says: the problem is running water or hot water, which may be the plumbing 83.51(1)(b) names or an item only 83.51(2)(a) names
              cite: "83.51(2)(a)"
              quote: "Functioning facilities for heat during winter, running water, and hot water."
              open_question: subsection_one_or_two
              applies_if:
                fact: problem_is_with
                equals: [running water, hot water]
            - says: the problem may be with the structure or the plumbing
              cite: "83.51(1)(b)"
              check: what the problem is with, beside the structural parts and the plumbing 83.51(1)(b) names
              applies_if:
                fact: problem_is_with
                equals: [something else]
            - says: the lease says the landlord repairs this problem
              cite: "83.56(1)"
              quote: "material provisions of the rental agreement"
              check: >-
                whether the lease's clause on maintenance and repairs says the landlord repairs this kind of problem,
                and whether an exception in it leaves this problem out (such as damage caused by a roommate or a guest)
              lease: maintenance_and_repairs
            - says: a building, housing, or health code where the unit is requires the landlord to fix it
              cite: "83.51(1)(a)"
              quote: "Comply with the requirements of applicable building, housing, and health codes"
              check: >-
                the building, housing, and health codes where the unit is, which this tool does not hold; the city or
                county code enforcement office can say whether one covers this problem, and can inspect the unit
        - says: the landlord's duty was not changed in writing, which 83.51(1) allows only for a single-family home or duplex
          cite: "83.51(1)"
          quote: "The landlord’s obligations under this subsection may be altered or modified in writing with respect to a single-family home or duplex."
          ways:
            - says: the unit is not a single-family home or duplex
              fact: single_family_or_duplex
              equals: false
              when_otherwise: The tenant confirmed the unit is a single-family home or duplex, where a writing may change the landlord's duty.
            - says: no lease term or other writing changes who repairs this
              check: whether the lease, or another writing the tenant signed, changes who repairs this kind of problem
              lease: maintenance_and_repairs
        - says: the problem was not caused by the tenant, a member of the tenant's family, or another person on the premises with the tenant's consent
          cite: "83.51(4)"
          quote: "The landlord is not responsible to the tenant under this section for conditions created or caused by the negligent or wrongful act or omission of the tenant, a member of the tenant’s family, or other person on the premises with the tenant’s consent."
          ways:
            - says: the cause is outside the people 83.51(4) names
              fact: caused_by
              equals:
                - nothing anyone did (age, wear, weather)
                - the landlord or its workers
                - someone you did not let in (a neighbor, a stranger)
              when_otherwise: On the tenant's answer, the cause is not plainly outside the people 83.51(4) names.
            - says: a roommate caused it, and whether a roommate is a person on the premises with the tenant's consent is not settled
              open_question: roommate_consent
              applies_if:
                fact: caused_by
                equals: [a roommate]
            - says: who caused it is not known yet
              check: who caused the problem; a work order, a technician's note, or the landlord's messages may say
              applies_if:
                fact: caused_by
                equals:
                  - I don't know
        - says: the tenant did not waive ending the lease by paying rent while knowing of the problem
          cite: "83.56(5)(a)"
          quote: "the tenant pays rent with actual knowledge of a noncompliance by the landlord"
          ways:
            - fact: rent_paid_since_known
              equals: false
              otherwise: unsettled
              open_question: rent_paid_waiver
              when_otherwise: >-
                The tenant confirmed paying rent after knowing of the problem; whether that waived ending the lease over
                a problem that is still not fixed is not settled.
      steps:
        - says: the written notice is delivered to the landlord in a way 83.56(4) allows (mailing, delivering a true copy, or e-mail under 83.505)
          cite: "83.56(4)"
          quote: "The delivery of the written notices required by subsections (1)-(3) shall be by mailing, delivering a true copy thereof, e-mailing in accordance with s. 83.505"
          ways:
            - says: the message went by mail or by hand
              fact: message_sent_by
              equals:
                - handed to the landlord or the office
                - regular mail
                - certified mail
              when_otherwise: The message did not go by mail or by hand, and 83.56(4) names e-mail only as 83.505 allows it.
            - says: the message went by e-mail, which counts under 83.56(4) only as 83.505 allows
              check: whether you and the landlord signed an addendum agreeing to notices by e-mail, as 83.505 describes
              lease: notices_to_landlord
              applies_if:
                fact: message_sent_by
                equals: [e-mail]
            - says: the message went another way
              check: how your message reached the landlord, beside the ways 83.56(4) names
              applies_if:
                fact: message_sent_by
                equals: [something else]
        - says: the notice names the problem and says the tenant intends to end the lease because of it
          cite: "83.56(1)"
          quote: "specifying the noncompliance and indicating the intention of the tenant to terminate the rental agreement by reason thereof"
          ways:
            - check: whether the words of your message name the problem and say you intend to end the lease because of it, as 83.56(1) says
              applies_if: message_mentions_ending
              beside: message_words
        - says: 7 days pass after that notice is delivered without the landlord fixing the problem
          cite: "83.56(1)"
          quote: "within 7 days after delivery of written notice by the tenant"
          clock: seven_days_after_termination_notice
      also_open: [material_noncompliance]

    - id: withhold_rent
      label: Not pay rent because of the problem, and raise it as a defense if the landlord sues for possession
      cite: "83.60(1)(b)"
      gates:
        - says: the problem is a failure of a duty in 83.51(1); a lease provision alone does not reach this defense
          cite: "83.60(1)(b)"
          quote: "The defense of a material noncompliance with s. 83.51 (1) may be raised by the tenant"
          ways:
            - says: the problem is with the structure (roof, windows, doors, floors, steps, porches, exterior walls, foundation) or the plumbing
              cite: "83.51(1)(b)"
              quote: "maintain the roofs, windows, doors, floors, steps, porches, exterior walls, foundations, and all other structural components in good repair and capable of resisting normal forces and loads and the plumbing in reasonable working condition"
              fact: problem_is_with
              equals:
                - the roof
                - a window or a door
                - a floor, steps, or a porch
                - an outside wall or the foundation
                - another part of the building's structure
                - pipes, drains, toilets, or faucets
              when_otherwise: The problem the tenant picked is not one of the parts 83.51(1)(b) names outright, the structural parts and the plumbing.
            - says: the problem is running water or hot water, which may be the plumbing 83.51(1)(b) names or an item only 83.51(2)(a) names
              cite: "83.51(2)(a)"
              quote: "Functioning facilities for heat during winter, running water, and hot water."
              open_question: subsection_one_or_two
              applies_if:
                fact: problem_is_with
                equals: [running water, hot water]
            - says: the problem may be with the structure or the plumbing
              cite: "83.51(1)(b)"
              check: what the problem is with, beside the structural parts and the plumbing 83.51(1)(b) names
              applies_if:
                fact: problem_is_with
                equals: [something else]
            - says: a building, housing, or health code where the unit is requires the landlord to fix it
              cite: "83.51(1)(a)"
              quote: "Comply with the requirements of applicable building, housing, and health codes"
              check: >-
                the building, housing, and health codes where the unit is, which this tool does not hold; the city or
                county code enforcement office can say whether one covers this problem, and can inspect the unit
        - says: the landlord's duty was not changed in writing, which 83.51(1) allows only for a single-family home or duplex
          cite: "83.51(1)"
          quote: "The landlord’s obligations under this subsection may be altered or modified in writing with respect to a single-family home or duplex."
          ways:
            - says: the unit is not a single-family home or duplex
              fact: single_family_or_duplex
              equals: false
              when_otherwise: The tenant confirmed the unit is a single-family home or duplex, where a writing may change the landlord's duty.
            - says: no lease term or other writing changes who repairs this
              check: whether the lease, or another writing the tenant signed, changes who repairs this kind of problem
              lease: maintenance_and_repairs
        - says: the problem was not caused by the tenant, a member of the tenant's family, or another person on the premises with the tenant's consent
          cite: "83.51(4)"
          quote: "The landlord is not responsible to the tenant under this section for conditions created or caused by the negligent or wrongful act or omission of the tenant, a member of the tenant’s family, or other person on the premises with the tenant’s consent."
          ways:
            - says: the cause is outside the people 83.51(4) names
              fact: caused_by
              equals:
                - nothing anyone did (age, wear, weather)
                - the landlord or its workers
                - someone you did not let in (a neighbor, a stranger)
              when_otherwise: On the tenant's answer, the cause is not plainly outside the people 83.51(4) names.
            - says: a roommate caused it, and whether a roommate is a person on the premises with the tenant's consent is not settled
              open_question: roommate_consent
              applies_if:
                fact: caused_by
                equals: [a roommate]
            - says: who caused it is not known yet
              check: who caused the problem; a work order, a technician's note, or the landlord's messages may say
              applies_if:
                fact: caused_by
                equals:
                  - I don't know
      steps:
        - says: the written notice is delivered to the landlord
          cite: "83.60(1)(b)"
          quote: "7 days have elapsed after the delivery of written notice by the tenant to the landlord"
          ways:
            - says: the message went by mail or by hand
              fact: message_sent_by
              equals:
                - handed to the landlord or the office
                - regular mail
                - certified mail
              otherwise: unsettled
              open_question: withholding_notice_delivery
              when_otherwise: The message went by e-mail, the resident portal, a text, or another way, and 83.60(1)(b) names no way of delivering the notice.
        - says: the notice names the problem and says the tenant intends not to pay rent because of it
          cite: "83.60(1)(b)"
          quote: "specifying the noncompliance and indicating the intention of the tenant not to pay rent by reason thereof"
          ways:
            - check: whether the words of your message name the problem and say you intend not to pay rent because of it, as 83.60(1)(b) says
              applies_if: message_mentions_rent
              beside: message_words
        - says: 7 days pass after that notice is delivered
          cite: "83.60(1)(b)"
          quote: "7 days have elapsed after the delivery of written notice by the tenant to the landlord"
          clock: seven_days_after_withholding_notice
      also_open: [material_noncompliance, court_procedure]

# ---------- read by the model ----------
guidance:
  questions:
    problem_description: What is the problem that needs repair? Describe it in your own words.
    problem_is_with: Which of these is the problem with? Pick the closest one.
    problem_started: What date did the problem start, or when did you first notice it?
    single_family_or_duplex: Is the place you rent a single-family house or a duplex (not a unit in an apartment building or a dorm)?
    caused_by: Who or what caused the problem, as far as you know?
    wrote_to_landlord: Have you sent the landlord or the office anything in writing about the problem (a letter, an e-mail, a resident portal request, a text)?
    message_sent_by: How did that written message reach the landlord? If you sent more than one, answer for the one that says the most about what you will do if the problem is not fixed.
    message_date: What date did that message reach the landlord (the day you handed it over or sent it, or the delivery date on a mail receipt)?
    message_mentions_ending: Does that message say anything about ending your lease or moving out?
    message_mentions_rent: Does that message say anything about not paying rent?
    message_words: Copy the sentences of that message that say what you asked for and what you will do if the problem is not fixed, word for word.
    rent_paid_since_known: Have you paid rent since you knew about the problem?
    landlord_response: What has the landlord said or done about the problem so far?
    eviction_action_filed: Has the landlord filed an eviction case in court against you?

  lease_checks:
    notices_to_landlord: Where and how the tenant's written notice must be sent under the lease.
    deposit_deductions: Whether the lease says anything about repairs the tenant pays for.

  evidence:
    - photos or video of the condition, with dates
    - the written notice, with proof of how and when it was delivered
    - every reply from the landlord, with dates
    - any code enforcement complaint or inspection report
    - rent receipts for the months since the problem started

  postures:
    core: [today's date, the condition and when it started, the repair requested, response deadline chosen by the tenant, delivery method]
    preserve: Describes the condition and asks for the repair. Cites nothing.
    assert: Adds the 83.51(1) duty, quoted.
    escalate: Adds the 83.56(1) sentence, quoted.
    notice_sufficiency: >-
      The 7-day periods this tool computes for this issue run from the delivery of a written notice. In Fla.
      Stat. 83.56(1) that is a notice "specifying the noncompliance and indicating the intention of the tenant to
      terminate the rental agreement by reason thereof", and in 83.60(1)(b) one "specifying the noncompliance and
      indicating the intention of the tenant not to pay rent by reason thereof". This letter states your request
      and any sentences quoted above. It is such a notice only if it states one of those intentions; ask in the chat to have this applied to your letter before you send it.

  failure_modes:
    - Treating any written complaint as the notice in 83.56(1) or 83.60(1)(b); each must state an intention, to end the lease or not to pay rent.
    - Saying the tenant may withhold rent for an item only 83.51(2) lists; 83.60(1)(b) speaks of "a material noncompliance with s. 83.51 (1)". For ending the lease, 83.56(1) also reaches "material provisions of the rental agreement", so read the lease's repair clause.
    - Counting the 7 days yourself, or from the date the notice was sent instead of delivered; whether they have passed comes from get_deadlines.
    - Skipping 83.56(5)(a). A tenant who "pays rent with actual knowledge of a noncompliance by the landlord" waives the right to terminate or sue for that noncompliance, "but not for any subsequent or continuing noncompliance".
    - Applying 83.51 to a condition the record says the tenant's side caused. 83.51(4) says "The landlord is not responsible to the tenant under this section for conditions created or caused by the negligent or wrongful act or omission of the tenant".
    - Explaining rent withholding without 83.60(2); once a case is filed, raising "any defense other than payment" requires paying the rent into the court registry.
    - Computing any date outside compute_deadlines.
