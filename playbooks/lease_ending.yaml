issue: lease_ending
description: The lease is ending or the tenancy is being ended; notice to leave or renew, and staying on after the end.
sections: ["83.575", "83.57", "83.58", "83.46", "83.42", "83.505"]   # the statute sections this playbook rests on; loaded into the prompt

provenance:
  statute_year: 2026
  verified_against: statutes/83.575.txt, statutes/83.57.txt, statutes/83.58.txt, statutes/83.46.txt, statutes/83.42.txt, statutes/83.505.txt
  verified_by: null          # your name, once you've read each quote against the file
  verified_on: null
  version: 0.6

counting:
  convention: calendar days, trigger day not counted, no weekend or holiday adjustment
  status: ASSUMPTION. Florida's court rule for counting days has not been checked against statutory deadlines outside litigation. Show this line with every computed date.

# ---------- read by code ----------
spec:
  elements:
    - id: fixed_term_lease
      type: bool
      source: [user]
    - id: term_end_date
      type: date
      source: [user]
      applies_if: fixed_term_lease
      compare_to: lease_profile.term_end      # shown next to the tenant's date when they differ
    - id: month_to_month
      type: bool
      source: [user]
    - id: period_end_date
      type: date
      source: [user]
      applies_if: month_to_month
    - id: lease_requires_end_notice
      type: bool
      source: [user]
      applies_if: fixed_term_lease
    - id: lease_end_notice_terms
      type: text
      source: [user]
      applies_if: lease_requires_end_notice
    - id: landlord_sent_notice_terms
      type: bool
      source: [user]
      applies_if: lease_requires_end_notice
    - id: landlord_notice_terms_date
      type: date
      source: [user]
      applies_if: landlord_sent_notice_terms
    - id: end_notice_given
      type: bool
      source: [user]
    - id: end_notice_sent_by
      type: choice
      source: [user]
      applies_if: end_notice_given
      choices:
        - handed to the landlord or the office
        - regular mail
        - certified mail
        - e-mail
        - a resident portal request or message
        - a text message
        - something else
    - id: end_notice_date
      type: date
      source: [user]
      applies_if: end_notice_given
    - id: planning_to_stay
      type: bool
      source: [user]
    - id: landlord_permission_to_stay
      type: bool
      source: [user]
      applies_if: planning_to_stay

  clocks:
    - id: month_to_month_notice_by_tenant
      actor: tenant
      trigger: period_end_date
      days: 30
      direction: before
      applies_if: month_to_month
      cite: "83.57(3)"
      quote: "When the tenancy is from month to month, by giving not less than 30 days’ notice prior to the end of any monthly period"

    - id: month_to_month_notice_by_landlord
      actor: landlord
      trigger: period_end_date
      days: 30
      direction: before
      applies_if: month_to_month
      cite: "83.57(3)"
      quote: "When the tenancy is from month to month, by giving not less than 30 days’ notice prior to the end of any monthly period"

  lease_overrides:
    - cite: "83.575(1)"
      quote: "A rental agreement may not require less than 30 days’ notice or more than 60 days’ notice from either the tenant or the landlord."
      note: Shown next to any end-of-term notice clause in the lease. The tool does not decide whether a clause complies.

  exclusions:
    - cite: "83.42(1)"
      quote: "Residency or detention in a facility, whether public or private, when residence or detention is incidental to the provision of medical, geriatric, educational, counseling, religious, or similar services."
      note: College housing. The tool records the facts and does not decide whether this exclusion applies.

  related_issues: []

  open_questions:
    - id: lease_set_period
      sections: ["83.575"]
      text: >-
        For a lease with a specific duration, the notice period comes from the lease (83.575(1)), and "A rental
        agreement may not require less than 30 days’ notice or more than 60 days’ notice from either the tenant or the
        landlord." The landlord's written notice under 83.575(2) is due "within 15 days before the start of the
        notification period contained in the rental agreement". Apply these to the lease's own words
        and the confirmed dates. This tool does not compute a date from a period the lease
        sets, so no last day is given. What stays open is what "within 15 days before the start" asks of the landlord.
      readings:
        - >-
          The landlord's notice must come during the 15 days that end when the notification period starts, not
          earlier.
        - >-
          The landlord's notice must come no later than 15 days before the notification period starts; earlier is
          also in time.
    - id: other_periods
      sections: ["83.57", "83.46"]
      text: >-
        83.57 also sets notice for tenancies from year to year, quarter to quarter, and week to week. This playbook
        computes only the month-to-month date. For the others, apply the text of 83.57 to the tenancy's period in the
        record and say the tool does not compute the date.
    - id: staying_on
      sections: ["83.575", "83.58"]
      text: >-
        83.575(3) covers a tenant who "remains on the premises with the permission of the landlord after the rental
        agreement has terminated", and 83.58 a tenant who "holds over and continues in possession of the dwelling unit
        or any part thereof after the expiration of the rental agreement without the permission of the landlord".
        Apply the one the record points to. What stays open is what counts as permission
        when the landlord said nothing, or took rent for a period after the end.
      readings:
        - >-
          Taking rent for a period after the end is permission: the landlord treats the tenant as staying on with its
          agreement.
        - >-
          Permission must be given; taking rent alone does not turn a tenant who "holds over and continues in
          possession" into one who stays with permission.

  # What the tenant can do, and what decides whether it is open (TODO items 81 and 84): checked by code
  # (deterministic.check_options) from the confirmed facts, the clocks, and the lease profile, and given to the model
  # before any step toward it. A gate is met through any of its ways. The gates are the author's to check.
  options:
    - id: end_month_to_month
      label: End a month-to-month tenancy at the end of this monthly period, with written notice at least 30 days before it ends
      cite: "83.57(3)"
      gates:
        - says: the tenancy is month to month
          cite: "83.57(3)"
          quote: "When the tenancy is from month to month, by giving not less than 30 days’ notice prior to the end of any monthly period"
          ways:
            - fact: month_to_month
              equals: true
              when_otherwise: The tenant confirmed the tenancy is not month to month.
        - says: the last day to give notice for this period has not passed, or the notice already went out by it
          cite: "83.57(3)"
          quote: "not less than 30 days’ notice prior to the end of any monthly period"
          ways:
            - says: the last day has not passed
              clock: month_to_month_notice_by_tenant
              equals: upcoming
              when_otherwise: The program's deadlines show the last day to give notice for this period has passed; the statute's words are any monthly period.
            - says: the notice already given went out by the last day
              applies_if: end_notice_given
              check: the date the notice was delivered, beside the last day the program's deadlines show
      steps:
        - says: a written notice delivered to the landlord, in a way the statute allows (mail, a true copy by hand, or e-mail under an e-mail addendum)
          cite: "83.57"
          quote: "may be terminated by either party giving written notice in the manner provided in s. 83.56 (4)"
          ways:
            - says: the notice went by mail or by hand
              fact: end_notice_sent_by
              equals:
                - handed to the landlord or the office
                - regular mail
                - certified mail
              when_otherwise: The notice did not go by mail or by hand, and 83.56(4) names e-mail only as 83.505 allows it.
            - says: the notice went by e-mail, which counts under 83.56(4) only as 83.505 allows
              check: whether you and the landlord signed an addendum agreeing to notices by e-mail, as 83.505 describes
              lease: notices_to_landlord
              applies_if:
                fact: end_notice_sent_by
                equals: [e-mail]
            - says: the notice went some other way
              check: how your notice reached the landlord, beside the ways 83.56(4) names
              applies_if:
                fact: end_notice_sent_by
                equals: [something else]

    - id: no_liquidated_damages_for_notice
      label: Leave at the end of the lease without owing the liquidated damages the lease sets for missing its notice, because the landlord did not send the notice the statute requires first
      cite: "83.575(2)"
      gates:
        - says: the lease has a fixed term
          cite: "83.575(1)"
          quote: "A rental agreement with a specific duration may contain a provision requiring the tenant to notify the landlord within a specified period before vacating the premises at the end of the rental agreement"
          ways:
            - fact: fixed_term_lease
              equals: true
              when_otherwise: The tenant confirmed the lease has no fixed end date.
        - says: the lease asks for notice before leaving at its end
          cite: "83.575(1)"
          quote: "may contain a provision requiring the tenant to notify the landlord within a specified period before vacating the premises at the end of the rental agreement"
          ways:
            - fact: lease_requires_end_notice
              equals: true
              when_otherwise: The tenant confirmed the lease asks for no notice before leaving at its end, so there is no notice to miss.
        - says: the landlord did not send, within 15 days before the lease's notice period began, a written notice of that requirement, the end date, and every fee
          cite: "83.575(2)"
          quote: "The landlord must provide such written notice to the tenant in a manner prescribed by s. 83.56 (4) within 15 days before the start of the notification period contained in the rental agreement."
          ways:
            - says: the landlord sent no such notice
              fact: landlord_sent_notice_terms
              equals: false
              when_otherwise: The tenant confirmed the landlord sent something in writing about the end of the lease.
            - says: the landlord's notice came outside those 15 days, or did not list the end date and every fee
              applies_if: landlord_sent_notice_terms
              check: the date the landlord's notice came and what it lists, beside the start of the lease's notice period
      steps: []
      also_open: [lease_set_period]

    - id: stay_with_permission
      label: Stay on after the lease ends with the landlord's permission
      cite: "83.575(3)"
      gates:
        - says: the landlord has agreed that the tenant may stay
          cite: "83.575(3)"
          quote: "If the tenant remains on the premises with the permission of the landlord after the rental agreement has terminated"
          ways:
            - fact: landlord_permission_to_stay
              equals: true
              when_otherwise: >-
                The tenant confirmed the landlord has not agreed. A tenant who holds over without permission may be
                removed and owe double the rent, under 83.58.
      steps: []
      also_open: [staying_on]

# ---------- read by the model ----------
guidance:
  questions:
    fixed_term_lease: Does your lease have a fixed end date (for example, a one-year lease)?
    term_end_date: What date does your lease term end?
    month_to_month: Is your tenancy month-to-month (no fixed end date, rent paid monthly)?
    period_end_date: What is the last day of the current monthly rent period (for example, the last day of this month)?
    lease_requires_end_notice: Does your lease require notice before moving out at the end of the lease?
    lease_end_notice_terms: What does the lease say about that notice? Copy its words.
    landlord_sent_notice_terms: Has the landlord sent you anything in writing about the end of your lease (a renewal offer, a move-out notice, a reminder of the notice you must give)?
    landlord_notice_terms_date: What date did that reach you?
    end_notice_given: Have you given the landlord anything in writing saying you are leaving or ending the tenancy?
    end_notice_sent_by: How did that written notice reach the landlord?
    end_notice_date: What date was your notice delivered to the landlord?
    planning_to_stay: Do you plan to stay after the lease or rental period ends?
    landlord_permission_to_stay: Has the landlord agreed that you may stay?

  lease_checks:
    term_end: The date the lease term ends.
    notice_before_vacating: Any notice the lease requires before moving out, next to 83.575(1).
    notices_to_landlord: Where and how the tenant's notice must be sent under the lease.
    move_out_requirements: What the lease requires at move-out.
    rent: The monthly rent, if the tenant stays on after the end.

  evidence:
    - the lease, especially its term and notice clauses
    - any written notice from the landlord about ending or renewing, with its delivery date
    - the tenant's own written notice, with proof of how and when it was delivered
    - any written agreement to stay on, with the rent agreed

  postures:
    core: [today's date, the end date, whether the tenant is leaving or asking to renew, delivery method]
    preserve: States the date the tenant will move out, or asks to renew, and asks the landlord to confirm. Cites nothing.
    assert: Adds the 83.57(3) sentence for a month-to-month tenancy, or the lease's notice clause, quoted.
    escalate: Adds the 83.575(2) sentence on the landlord's written notice, quoted.
    notice_sufficiency: >-
      For a month-to-month tenancy, Fla. Stat. 83.57 says the tenancy "may be terminated by either party giving
      written notice in the manner provided in s. 83.56 (4)" with "not less than 30 days’ notice prior to the
      end of any monthly period", and this tool computed that date from the period end you gave. For a lease
      with a fixed end date, the notice period comes from your lease, and this tool does not compute it. Ask in the chat to have 83.57 or your lease's notice clause applied to your tenancy before you send it.

  failure_modes:
    - Computing a notice date from a period the lease sets; the tool computes only the month-to-month dates.
    - Saying a lease's end-of-term notice clause binds the tenant without the condition in 83.575(1), that it also requires the landlord to notify the tenant "within such notice period if the rental agreement will not be renewed".
    - Saying the tenant owes liquidated damages for missing the lease's notice without 83.575(2)'s condition, the landlord's written notice "specifying the tenant’s obligations under the notification provision".
    - Applying 83.575(3)'s extra month's rent without both its conditions, that the tenant "remains on the premises with the permission of the landlord" and "fails to give notice required under s. 83.57 (3)"; or 83.58's double rent while the record does not show whether the landlord gave permission to stay.
    - Applying 83.57 to a lease with a specific duration, or 83.575 to a month-to-month tenancy; when the agreement says nothing on duration, 83.46(2) sets it by how often rent is paid.
    - Computing any date outside compute_deadlines.
