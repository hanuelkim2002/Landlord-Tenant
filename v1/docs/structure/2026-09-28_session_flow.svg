<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img">
<title>How a session works (structure as of 2026-09-28)</title>
<desc>run.py asks new or existing. A new matter picks a tenant id, makes a matter folder, reads the lease with Gemma, and runs intake. An existing matter is loaded, asks what is new, and runs resume on an update. Both then go through the intake sheet, where the tenant confirms facts, and into the chat, whose prompt is rebuilt from the record on every model call. In the chat, propose_facts sends the tenant back to the sheet, get_deadlines computes dates, and draft_letter fills a template. bye ends the session.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .c-purple > rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .c-purple > .th { fill: #3C3489; } .c-purple > .ts { fill: #534AB7; }
  .c-teal > rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .c-teal > .th { fill: #085041; } .c-teal > .ts { fill: #0F6E56; }
  .c-gray > rect, rect.c-gray { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .c-gray > .th { fill: #444441; } .c-gray > .ts { fill: #5F5E5A; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="640" fill="#FFFFFF"/>
<g class="c-gray"><rect x="220" y="30" width="240" height="44" rx="4"/>
<text class="th" x="340" y="48" text-anchor="middle">run.py</text>
<text class="ts" x="340" y="65" text-anchor="middle">New or existing?</text></g>
<path d="M220 52 H180 V108" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M460 52 H500 V108" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="110" width="280" height="44" rx="4"/>
<text class="th" x="180" y="128" text-anchor="middle">Tenant id</text>
<text class="ts" x="180" y="145" text-anchor="middle">reuse, or new random id</text></g>
<line x1="180" y1="154" x2="180" y2="173" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="175" width="280" height="44" rx="4"/>
<text class="th" x="180" y="193" text-anchor="middle">New matter folder</text>
<text class="ts" x="180" y="210" text-anchor="middle">m-00N, session opens</text></g>
<line x1="180" y1="219" x2="180" y2="238" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="240" width="280" height="44" rx="4"/>
<text class="th" x="180" y="258" text-anchor="middle">Read the lease</text>
<text class="ts" x="180" y="275" text-anchor="middle">Gemma reads, quotes checked</text></g>
<line x1="180" y1="284" x2="180" y2="303" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="305" width="280" height="44" rx="4"/>
<text class="th" x="180" y="323" text-anchor="middle">intake(description)</text>
<text class="ts" x="180" y="340" text-anchor="middle">model: classify, fill_facts</text></g>
<g class="c-teal"><rect x="360" y="110" width="280" height="44" rx="4"/>
<text class="th" x="500" y="128" text-anchor="middle">Pick a saved matter</text>
<text class="ts" x="500" y="145" text-anchor="middle">load it, session opens</text></g>
<line x1="500" y1="154" x2="500" y2="173" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="360" y="175" width="280" height="44" rx="4"/>
<text class="th" x="500" y="193" text-anchor="middle">Anything new?</text>
<text class="ts" x="500" y="210" text-anchor="middle">Enter skips to the sheet</text></g>
<line x1="500" y1="219" x2="500" y2="238" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="360" y="240" width="280" height="44" rx="4"/>
<text class="th" x="500" y="258" text-anchor="middle">resume(update)</text>
<text class="ts" x="500" y="275" text-anchor="middle">logged; issues only added</text></g>
<line x1="500" y1="284" x2="500" y2="303" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="360" y="305" width="280" height="44" rx="4"/>
<text class="th" x="500" y="323" text-anchor="middle">fill_facts on the update</text>
<text class="ts" x="500" y="340" text-anchor="middle">changes shown both ways</text></g>
<path d="M180 349 V366 H250 V383" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M500 349 V366 H430 V383" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="160" y="385" width="360" height="44" rx="4"/>
<text class="th" x="340" y="403" text-anchor="middle">Intake sheet (code)</text>
<text class="ts" x="340" y="420" text-anchor="middle">tenant confirms; related issues join</text></g>
<line x1="340" y1="429" x2="340" y2="458" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="160" y="460" width="360" height="44" rx="4"/>
<text class="th" x="340" y="478" text-anchor="middle">Chat</text>
<text class="ts" x="340" y="495" text-anchor="middle">prompt rebuilt from the record</text></g>
<line x1="520" y1="482" x2="548" y2="482" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="550" y="460" width="100" height="44" rx="4"/>
<text class="th" x="600" y="478" text-anchor="middle">bye</text>
<text class="ts" x="600" y="495" text-anchor="middle">session ends</text></g>
<path d="M340 504 V518 H150 V535" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="504" x2="340" y2="535" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M340 518 H530 V535" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="60" y="537" width="180" height="44" rx="4"/>
<text class="th" x="150" y="555" text-anchor="middle">propose_facts</text>
<text class="ts" x="150" y="572" text-anchor="middle">model suggests only</text></g>
<g class="c-gray"><rect x="250" y="537" width="180" height="44" rx="4"/>
<text class="th" x="340" y="555" text-anchor="middle">get_deadlines</text>
<text class="ts" x="340" y="572" text-anchor="middle">the only date math</text></g>
<g class="c-gray"><rect x="440" y="537" width="180" height="44" rx="4"/>
<text class="th" x="530" y="555" text-anchor="middle">draft_letter</text>
<text class="ts" x="530" y="572" text-anchor="middle">a code template</text></g>
<path d="M60 559 H30 V407 H158" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<rect x="160" y="604" width="12" height="12" rx="2" class="c-purple"/>
<text class="ts" x="178" y="614">new matter</text>
<rect x="270" y="604" width="12" height="12" rx="2" class="c-teal"/>
<text class="ts" x="288" y="614">existing matter</text>
<rect x="400" y="604" width="12" height="12" rx="2" class="c-gray"/>
<text class="ts" x="418" y="614">both</text>
</svg>
